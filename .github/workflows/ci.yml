# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium ffmpeg
      # `npm test` in two steps, so the demo tests run and record even when another test fails.
      - run: npm run test:unit
      # The demos in docs/demo as deterministic tests (tests/demo): a video of every test.
      - name: Demo tests
        if: ${{ !cancelled() }}
        run: npm run test:demo
      # The key moments of the videos against baselines made by .github/workflows/baselines.yml;
      # the important differences go to the job summary and test-results/frames/*-diff.png.
      - name: Compare the video key moments
        if: ${{ !cancelled() }}
        run: npm run test:frames
      # The demo videos, their key moments with highlighted differences, the screenshot diffs of a
      # failure and the HTML report, on every run.
      - name: Upload the demo videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: demo-videos
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30
      # The real CLI on real GitHub repositories at fixed commits; the job's token for the rate limit.
      - run: node --test tests/e2e/real.test.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
