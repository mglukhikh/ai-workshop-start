<!doctype html>
<!-- The local web view, served by `skill-atlas serve`: the repository, its skills, their SKILL.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fff6df;
    --ink: #302219;
    --muted: #6b5340;
    --border: #c6aa79;
    --accent: #782e35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(12px, 4vw, 48px);
    min-height: 100vh;
    color: var(--ink);
    background: radial-gradient(ellipse at top, #59353a, #261a21 75%);
    font: 16px/1.55 "Palatino Linotype", Palatino, Georgia, serif;
  }
  .atlas {
    margin: auto;
    max-width: 1120px;
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - clamp(24px, 8vw, 96px));
    background: radial-gradient(ellipse at center, var(--paper) 40%, #eedab0);
    border: 4px double #9d7645;
    box-shadow: 0 12px 40px #160e16a0;
  }
  header {
    padding: 24px clamp(16px, 4vw, 44px);
    border-bottom: 4px double var(--border);
  }
  header h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.1; margin: 0 0 18px; color: var(--accent); }
  form { display: flex; gap: 8px; }
  input, button { padding: 9px 12px; font: inherit; border-radius: 4px; }
  input { flex: 1; min-width: 0; border: 1px solid #987749; background: var(--paper); color: inherit; }
  button { border: 1px solid var(--accent); background: var(--accent); color: white; cursor: pointer; }
  button:disabled { opacity: .65; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status, #current-repository { padding: 8px 16px; color: var(--muted); overflow-wrap: anywhere; }
  #scan-progress, #filter { margin: 0 16px 8px; width: calc(100% - 32px); accent-color: var(--accent); }
  #status.error { color: var(--accent); }
  #warnings { flex: none; max-height: 30vh; overflow: auto; margin: 0; padding: 0 16px 0 32px; color: #754318; font-size: 14px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); border-top: 1px solid var(--border); }
  #skills { list-style: none; margin: 0; padding: 0; border-right: 4px double var(--border); overflow-wrap: anywhere; }
  #skills li { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
  #skills li:hover { background: #782e350e; }
  #skills li[aria-selected="true"] { background: #782e3517; box-shadow: inset 4px 0 var(--accent); }
  .name { font-weight: 700; color: var(--accent); }
  .description, .path { font-size: 14px; color: var(--muted); }
  #skill { padding: 16px clamp(16px, 3vw, 32px); min-width: 0; overflow-wrap: anywhere; }
  #skill h2 { margin: 0 0 8px; color: var(--accent); }
  #skill a { font-size: 14px; color: var(--accent); }
  #skill pre { white-space: pre-wrap; font: 13px/1.55 ui-monospace, monospace; border: 1px solid var(--border); background: var(--paper); padding: 14px; }
  @media (max-width: 640px) {
    main { grid-template-columns: minmax(0, 1fr); }
    #skills { border-right: 0; max-height: 40vh; overflow: auto; }
  }
</style>
</head>
<body>
<div class="atlas">
<header>
  <h1>Skill Atlas</h1>
  <form id="form">
    <input id="repo" name="repo" placeholder="https://github.com/JetBrains/kotlin, …/tree/&lt;commit | branch&gt;, or a directory" autofocus>
    <button id="scan">Scan</button>
  </form>
</header>
<div id="status" role="status">Paste a repository or organization link and press Scan.</div>
<progress id="scan-progress" aria-label="Organization scan progress" hidden></progress>
<div id="current-repository" role="status" hidden></div>
<ul id="warnings"></ul>
<input id="filter" type="search" aria-label="Filter skills" placeholder="Filter skills by words" hidden>
<main>
  <ul id="skills" role="listbox" aria-label="Skills"></ul>
  <section id="skill" aria-live="polite"></section>
</main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  // Text only, never HTML: the SKILL.md files are the repository's, not ours.
  function element(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function setStatus(text, error = false) { $('status').textContent = text; $('status').className = error ? 'error' : ''; }

  async function scan(repo) {
    $('scan').disabled = true;
    $('scan').textContent = 'Scanning…';
    $('skills').replaceChildren(); $('skill').replaceChildren(); $('warnings').replaceChildren();
    $('filter').hidden = true;
    $('filter').value = '';
    setStatus(`Scanning ${repo}…`);
    const bar = $('scan-progress');
    const currentRepository = $('current-repository');
    try {
      const response = await fetch(`/api/scan?repo=${encodeURIComponent(repo)}&progress=1`);
      if (!response.ok) return setStatus((await response.json()).error, true);
      let pending = '';
      for await (const chunk of response.body.pipeThrough(new TextDecoderStream())) {
        pending += chunk;
        const lines = pending.split('\n');
        pending = lines.pop();
        for (const line of lines) {
          const event = JSON.parse(line);
          if (event.error) return setStatus(event.error, true);
          if (event.result) return show(event.result);
          const { completed, total, current } = event.progress;
          bar.hidden = false;
          if (total) {
            bar.setAttribute('max', total);
            bar.setAttribute('value', completed);
          } else {
            bar.removeAttribute('value');
          }
          currentRepository.hidden = !current;
          currentRepository.textContent = current ? `Scanning ${current}…` : '';
          setStatus(`Scanned ${completed} ${completed === 1 ? 'repository' : 'repositories'}`);
        }
      }
      setStatus('The scan ended before returning results.', true);
    } catch (error) {
      setStatus(`Cannot reach the Skill Atlas server: ${error.message}`, true);
    } finally {
      bar.hidden = true;
      currentRepository.hidden = true;
      $('scan').disabled = false;
      $('scan').textContent = 'Scan';
    }
  }

  function show({ repository, skills, warnings }) {
    setStatus(`${repository.id} · ${skills.length} ${skills.length === 1 ? 'skill' : 'skills'}`);
    $('warnings').replaceChildren(...warnings.map((text) => element('li', { textContent: `warning: ${text}` })));
    const filter = $('filter');
    filter.hidden = skills.length === 0;
    filter.oninput = renderSkills;
    renderSkills();

    function renderSkills() {
      const query = filter.value.trim().toLowerCase();
      const words = query ? query.split(/\s+/) : [];
      const matches = skills.filter(({ name, description, path, repository: skillRepository }) => {
        const searchable = `${name} ${description} ${path} ${skillRepository === repository.id ? '' : skillRepository}`.toLowerCase();
        return words.every((word) => searchable.includes(word));
      });
      $('skill').replaceChildren();
      $('skills').replaceChildren(...matches.map((skill) => skillOption(skill, repository.id)));
      if (matches.length > 0) select($('skills').firstChild, matches[0]);
      else if (words.length > 0) $('skill').textContent = 'No matching skills.';
    }
  }

  function skillOption(skill, repositoryId) {
    const item = element('li', { role: 'option', tabIndex: 0 },
        element('div', { className: 'name', textContent: skill.name }),
        element('div', { className: 'description', textContent: skill.description }),
        element('div', { className: 'path', textContent: skill.repository === repositoryId ? skill.path : `${skill.repository} · ${skill.path}` }));
    item.onclick = () => select(item, skill);
    item.onkeydown = (event) => { if (event.key === 'Enter') select(item, skill); };
    return item;
  }

  function select(item, skill) {
    for (const other of $('skills').children) other.setAttribute('aria-selected', String(other === item));
    $('skill').replaceChildren(
      element('h2', { textContent: skill.name }),
      element('a', { href: skill.link, textContent: skill.link, target: '_blank', rel: 'noopener' }),
      ...(skill.copies.length > 0 ? [element('div', { className: 'path', textContent: `also in ${skill.copies.join(', ')}` })] : []),
      element('pre', { textContent: skill.text }));
  }

  $('form').onsubmit = (event) => {
    event.preventDefault();
    const repo = $('repo').value.trim();
    if (!repo) return;
    history.replaceState(null, '', `?repo=${encodeURIComponent(repo)}`);
    scan(repo);
  };

  const initial = new URLSearchParams(location.search).get('repo');
  if (initial) { $('repo').value = initial; scan(initial); }
</script>
</body>
</html>
