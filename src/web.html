<!doctype html>
<!-- The local web view, served by `skill-atlas serve`: the repository, its skills, their SKILL.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa; --panel: #fff; --text: #1d2330; --muted: #6b7280; --border: #e3e6eb;
    --accent: #4f6ef7; --accent-soft: #4f6ef71a; --warn: #a15c00; --warn-soft: #fff4e0; --error: #c62828;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --panel: #1c1f26; --text: #e6e8ec; --muted: #9aa1ad; --border: #2c313b;
      --accent: #7b93ff; --accent-soft: #7b93ff22; --warn: #f0b45a; --warn-soft: #3a2c14; --error: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  form { display: flex; gap: 8px; flex: 1; }
  input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #repo { flex: 1; }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #summary { padding: 10px 20px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  #summary strong { color: var(--text); font-size: 16px; }
  #summary.error { color: var(--error); }
  #warnings:empty { display: none; }
  #warnings { margin: 0 20px 10px; padding: 8px 12px 8px 30px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; font-size: 13px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(260px, 1fr) 2.2fr; gap: 16px; padding: 0 20px 20px; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #filter { margin: 10px; }
  #skills { list-style: none; margin: 0; padding: 0 6px 6px; overflow: auto; flex: 1; }
  #skills li { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  #skills li:hover { background: var(--accent-soft); }
  #skills li[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  #skills li:focus-visible { outline: 2px solid var(--accent); }
  .name { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .badge { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; }
  .description { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .path { font: 12px var(--mono); color: var(--muted); word-break: break-all; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  #skill-head { padding: 14px 18px 0; }
  #skill-head h2 { margin: 0 0 2px; font-size: 20px; }
  #skill-head p { margin: 4px 0; }
  #skill-head a { color: var(--accent); font-size: 13px; word-break: break-all; }
  [role="tablist"] { display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--border); }
  [role="tab"] { background: none; color: var(--muted); border-radius: 0; padding: 8px 12px; border-bottom: 2px solid transparent; font-weight: 600; }
  [role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  [role="tab"] .badge { margin-left: 4px; }
  [role="tabpanel"] { overflow: auto; flex: 1; }
  #text { margin: 0; padding: 12px 0; font: 13px/1.6 var(--mono); }
  #text div { padding: 0 18px 0 0; white-space: pre-wrap; word-break: break-word; display: grid; grid-template-columns: 3.5em 1fr; }
  #text div::before { content: attr(data-line); color: var(--muted); opacity: .6; text-align: right; padding-right: 1em; user-select: none; }
  #text div.heading { font-weight: 700; color: var(--accent); }
  #text div.target { background: var(--accent-soft); }
  #contents { list-style: none; margin: 0; padding: 12px 18px; }
  #contents li { margin: 1px 0; }
  #contents a { display: block; color: var(--text); text-decoration: none; padding: 4px 8px; border-radius: 6px; }
  #contents a:hover { background: var(--accent-soft); color: var(--accent); }
  #contents .level-1 a { font-weight: 700; font-size: 16px; }
  #contents .level-2 { padding-left: 18px; }
  #contents .level-2 a { font-weight: 600; }
  #contents .level-3 { padding-left: 36px; }
  #contents .level-3 a { color: var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } header { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body>
<header>
  <h1>Skill <span>Atlas</span></h1>
  <form id="form">
    <input id="repo" name="repo" placeholder="https://github.com/JetBrains/kotlin, …/tree/&lt;commit | branch&gt;, or a directory" aria-label="Repository link" autofocus>
    <button id="scan">Scan</button>
  </form>
</header>
<div id="summary">Paste a repository link and press Scan.</div>
<ul id="warnings"></ul>
<main>
  <section class="panel">
    <input id="filter" type="search" placeholder="Filter skills" aria-label="Filter skills">
    <ul id="skills" role="listbox" aria-label="Skills"></ul>
  </section>
  <section class="panel" id="skill">
    <div class="empty">No skill selected.</div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // Text only, never HTML: the SKILL.md files are the repository's, not ours.
  function element(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }
  const plural = (count, word) => `${count} ${word}${count === 1 ? '' : 's'}`;

  let skills = [];
  let selected;
  let tab = 'text';

  function summary(...children) { $('summary').className = ''; $('summary').replaceChildren(...children); }
  function failure(text) { $('summary').className = 'error'; $('summary').textContent = text; }

  async function scan(repo) {
    $('scan').disabled = true;
    skills = []; selected = undefined;
    $('skills').replaceChildren(); $('warnings').replaceChildren(); $('filter').value = '';
    showSkill();
    summary(`Scanning ${repo}…`);
    try {
      const response = await fetch(`/api/scan?repo=${encodeURIComponent(repo)}`);
      const result = await response.json();
      if (!response.ok) return failure(result.error);
      skills = result.skills;
      summary(element('strong', { textContent: result.repository.id }), plural(skills.length, 'skill'));
      $('warnings').replaceChildren(...result.warnings.map((text) => element('li', { textContent: text })));
      showList();
      if (skills.length > 0) select(skills[0]);
    } catch (error) {
      failure(`Cannot reach the Skill Atlas server: ${error.message}`);
    } finally {
      $('scan').disabled = false;
    }
  }

  function showList() {
    const query = $('filter').value.trim().toLowerCase();
    const shown = skills.filter((skill) => `${skill.name} ${skill.description} ${skill.path}`.toLowerCase().includes(query));
    if (shown.length === 0) {
      return $('skills').replaceChildren(element('li', { className: 'empty', textContent: skills.length ? 'No skill matches.' : 'No skills.' }));
    }
    $('skills').replaceChildren(...shown.map((skill) => {
      const item = element('li', { role: 'option', tabIndex: 0 },
        element('div', { className: 'name' }, skill.name,
          ...(skill.copies.length ? [element('span', { className: 'badge', textContent: `+${skill.copies.length} ${skill.copies.length === 1 ? 'copy' : 'copies'}` })] : [])),
        element('div', { className: 'description', textContent: skill.description }),
        element('div', { className: 'path', textContent: skill.path }));
      item.setAttribute('aria-selected', String(skill === selected));
      item.onclick = () => select(skill);
      item.onkeydown = (event) => { if (event.key === 'Enter') select(skill); };
      return item;
    }));
  }

  function select(skill) {
    selected = skill;
    showList();
    showSkill();
  }

  /** The selected skill: its name and link, then the SKILL.md and Contents tabs. */
  function showSkill() {
    const skill = selected;
    if (!skill) return $('skill').replaceChildren(element('div', { className: 'empty', textContent: 'No skill selected.' }));
    const tabButton = (id, label, badge) => {
      const button = element('button', { role: 'tab', id: `tab-${id}`, type: 'button' }, label,
        ...(badge === undefined ? [] : [element('span', { className: 'badge', textContent: String(badge) })]));
      button.setAttribute('aria-selected', String(tab === id));
      button.setAttribute('aria-controls', id);
      button.onclick = () => { tab = id; showSkill(); };
      return button;
    };
    const lines = skill.text.replace(/\r?\n$/, '').split(/\r?\n/);
    const headingLines = new Set(skill.headings.map((heading) => heading.line));
    const text = element('div', { id: 'text', role: 'tabpanel', hidden: tab !== 'text' },
      ...lines.map((line, index) => {
        const row = element('div', { textContent: line, className: headingLines.has(index + 1) ? 'heading' : '' });
        row.dataset.line = String(index + 1);
        return row;
      }));
    const contents = element('ul', { id: 'contents', role: 'tabpanel', hidden: tab !== 'contents' },
      ...(skill.headings.length === 0
        ? [element('li', { className: 'empty', textContent: 'No titles in this SKILL.md.' })]
        : skill.headings.map((heading) => {
            const link = element('a', { href: `#line-${heading.line}`, textContent: heading.title });
            link.onclick = (event) => { event.preventDefault(); jump(heading.line); };
            return element('li', { className: `level-${heading.level}` }, link);
          })));
    $('skill').replaceChildren(
      element('div', { id: 'skill-head' },
        element('h2', { textContent: skill.name }),
        ...(skill.description ? [element('p', { textContent: skill.description })] : []),
        element('a', { href: skill.link, textContent: skill.link, target: '_blank', rel: 'noopener' }),
        ...(skill.copies.length ? [element('div', { className: 'path', textContent: `also in ${skill.copies.join(', ')}` })] : [])),
      element('div', { role: 'tablist', ariaLabel: 'SKILL.md views' }, tabButton('text', 'SKILL.md'), tabButton('contents', 'Contents', skill.headings.length)),
      text,
      contents);
  }

  /** From Contents to the title's line in SKILL.md. */
  function jump(line) {
    tab = 'text';
    showSkill();
    const row = $('text').querySelector(`[data-line="${line}"]`);
    row.classList.add('target');
    row.scrollIntoView({ block: 'start' });
  }

  $('filter').oninput = showList;
  $('form').onsubmit = (event) => {
    event.preventDefault();
    const repo = $('repo').value.trim();
    if (!repo) return;
    history.replaceState(null, '', `?repo=${encodeURIComponent(repo)}`);
    scan(repo);
  };

  const initial = new URLSearchParams(location.search).get('repo');
  if (initial) { $('repo').value = initial; scan(initial); }
</script>
</body>
</html>
