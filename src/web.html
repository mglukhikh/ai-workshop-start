<!doctype html>
<!-- The local web view, served by `skill-atlas serve`: the repository, its skills, their SKILL.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fff6df;
    --ink: #302219;
    --muted: #6b5340;
    --border: #c6aa79;
    --accent: #782e35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(12px, 4vw, 48px);
    min-height: 100vh;
    color: var(--ink);
    background: radial-gradient(ellipse at top, #59353a, #261a21 75%);
    font: 16px/1.55 "Palatino Linotype", Palatino, Georgia, serif;
  }
  .atlas {
    margin: auto;
    max-width: 1120px;
    display: flex;
    flex-direction: column;
    height: max(700px, calc(100vh - clamp(24px, 8vw, 96px)));
    background: radial-gradient(ellipse at center, var(--paper) 40%, #eedab0);
    border: 4px double #9d7645;
    box-shadow: 0 12px 40px #160e16a0;
  }
  header {
    padding: 24px clamp(16px, 4vw, 44px);
    border-bottom: 4px double var(--border);
  }
  header h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.1; margin: 0 0 18px; color: var(--accent); }
  form { display: flex; gap: 8px; }
  input, button { padding: 9px 12px; font: inherit; border-radius: 4px; }
  form input { flex: 1; min-width: 0; }
  input { border: 1px solid #987749; background: var(--paper); color: inherit; }
  button { border: 1px solid var(--accent); background: var(--accent); color: white; cursor: pointer; }
  button:disabled { opacity: .65; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status, #current-repository { padding: 8px 16px; color: var(--muted); overflow-wrap: anywhere; }
  #scan-progress, #filter { margin: 0 16px 8px; width: calc(100% - 32px); accent-color: var(--accent); }
  #status.error { color: var(--accent); }
  #toggle-warnings { align-self: flex-start; margin: 0 16px 8px; }
  #warnings { flex: none; max-height: 30vh; overflow: auto; margin: 0; padding: 0 16px 0 32px; color: #754318; font-size: 14px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); border-top: 1px solid var(--border); }
  #skills { list-style: none; margin: 0; padding: 0; border-right: 4px double var(--border); overflow: auto; overflow-wrap: anywhere; }
  #skills li { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
  #skills li:hover { background: #782e350e; }
  #skills li[aria-selected="true"] { background: #782e3517; box-shadow: inset 4px 0 var(--accent); }
  .name { font-weight: 700; color: var(--accent); }
  .description, .path { font-size: 14px; color: var(--muted); }
  .description mark, #skill-head p mark { background: #e9c77a; color: inherit; border-radius: 2px; }
  #skill { --skill-padding-top: 16px; padding: var(--skill-padding-top) clamp(16px, 3vw, 32px); min-width: 0; overflow: auto; overflow-wrap: anywhere; }
  #skill h2 { margin: 0 0 8px; color: var(--accent); }
  #skill a { font-size: 14px; color: var(--accent); }
  .badge { font-size: 12px; font-weight: 400; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 24px 16px; text-align: center; font-style: italic; }
  #skills li.empty { cursor: default; border-bottom: 0; }
  #skills li.empty:hover { background: none; }
  #skill-head p { margin: 4px 0 8px; color: var(--muted); }
  [role="tablist"] { position: sticky; top: calc(-1 * var(--skill-padding-top)); z-index: 1; background: var(--paper); display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid var(--border); }
  [role="tab"] { background: none; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 6px 12px; }
  [role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  #text { margin: 0; padding: 12px 0; font: 13px/1.55 ui-monospace, monospace; border: 1px solid var(--border); border-top: 0; background: var(--paper); }
  #text div { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); padding-right: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #text div::before { content: attr(data-line); color: var(--muted); opacity: .7; text-align: right; padding-right: 1em; user-select: none; }
  #text div.heading { font-weight: 700; color: var(--accent); }
  #text div.target { background: #e9c77a80; }
  #contents { list-style: none; margin: 0; padding: 12px 8px; border: 1px solid var(--border); border-top: 0; background: var(--paper); }
  #contents a { display: block; padding: 3px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: 16px; }
  #contents a:hover { background: #782e350e; color: var(--accent); }
  #contents .level-1 a { font-weight: 700; }
  #contents .level-2 { padding-left: 20px; }
  #contents .level-3 { padding-left: 40px; }
  #contents .level-3 a { color: var(--muted); font-size: 15px; }
  @media (max-width: 640px) {
    .atlas { height: auto; min-height: calc(100vh - clamp(24px, 8vw, 96px)); }
    main { grid-template-columns: minmax(0, 1fr); }
    #skills { border-right: 0; max-height: 40vh; overflow: auto; }
  }
</style>
</head>
<body>
<div class="atlas">
<header>
  <h1>Skill Atlas</h1>
  <form id="form">
    <input id="repo" name="repo" placeholder="https://github.com/JetBrains/kotlin, …/tree/&lt;commit | branch&gt;, or a directory" aria-label="Repository link" autofocus>
    <button id="scan">Scan</button>
    <button id="stop" type="button" hidden disabled>Stop Scanning</button>
  </form>
</header>
<div id="status" role="status">Paste a repository or organization link and press Scan.</div>
<progress id="scan-progress" aria-label="Organization scan progress" hidden></progress>
<div id="current-repository" role="status" hidden></div>
<button id="toggle-warnings" type="button" aria-controls="warnings" aria-expanded="false" hidden>Show warnings</button>
<ul id="warnings" hidden></ul>
<input id="filter" type="search" aria-label="Filter skills" placeholder="Filter skills by words" hidden>
<main>
  <ul id="skills" role="listbox" aria-label="Skills"></ul>
  <section id="skill" aria-live="polite"><div class="empty">No skill selected.</div></section>
</main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  // Text only, never HTML: the SKILL.md files are the repository's, not ours.
  function element(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function setStatus(text, error = false) { $('status').textContent = text; $('status').className = error ? 'error' : ''; }

  const warningsPanel = $('warnings');
  const warningsToggle = $('toggle-warnings');

  function setWarningsExpanded(expanded) {
    warningsPanel.hidden = !expanded;
    warningsToggle.textContent = expanded ? 'Hide warnings' : 'Show warnings';
    warningsToggle.setAttribute('aria-expanded', String(expanded));
  }

  warningsToggle.onclick = () => setWarningsExpanded(warningsPanel.hidden);

  function showEmptySkills(listMessage, detailMessage = 'No skill selected.') {
    $('skills').replaceChildren(element('li', { className: 'empty', role: 'presentation' }, listMessage));
    $('skill').replaceChildren(element('div', { className: 'empty' }, detailMessage));
  }

  async function scan(repo) {
    $('scan').disabled = true;
    $('scan').textContent = 'Scanning…';
    showEmptySkills('Scanning…');
    warningsPanel.replaceChildren();
    warningsToggle.hidden = true;
    setWarningsExpanded(false);
    $('filter').hidden = true;
    $('filter').value = '';
    setStatus(`Scanning ${repo}…`);
    const bar = $('scan-progress');
    const currentRepository = $('current-repository');
    const stop = $('stop');
    const id = crypto.randomUUID();
    let shown = false;
    try {
      const response = await fetch(`/api/scan?repo=${encodeURIComponent(repo)}&progress=1&id=${id}`);
      if (!response.ok) return setStatus((await response.json()).error, true);
      stop.hidden = false;
      stop.disabled = false;
      stop.onclick = async () => {
        stop.disabled = true;
        try {
          const response = await fetch(`/api/stop?id=${id}`, { method: 'POST' });
          if (!response.ok) throw new Error();
        } catch {
          if (stop.onclick === requestStop) {
            stop.disabled = false;
            setStatus('Could not stop the scan.', true);
          }
        }
      };
      const requestStop = stop.onclick;
      let pending = '';
      for await (const chunk of response.body.pipeThrough(new TextDecoderStream())) {
        pending += chunk;
        const lines = pending.split('\n');
        pending = lines.pop();
        for (const line of lines) {
          const event = JSON.parse(line);
          if (event.error) return setStatus(event.error, true);
          if (event.stopped) return setStatus('Scan stopped.');
          if (event.result) { shown = true; return show(event.result); }
          const { completed, total, current } = event.progress;
          bar.hidden = false;
          if (total) {
            bar.setAttribute('max', total);
            bar.setAttribute('value', completed);
          } else {
            bar.removeAttribute('value');
          }
          currentRepository.hidden = !current;
          currentRepository.textContent = current ? `Scanning ${current}…` : '';
          setStatus(`Scanned ${completed} ${completed === 1 ? 'repository' : 'repositories'}`);
        }
      }
      setStatus('The scan ended before returning results.', true);
    } catch (error) {
      setStatus(`Cannot reach the Skill Atlas server: ${error.message}`, true);
    } finally {
      if (!shown) showEmptySkills('No skills.');
      stop.hidden = true;
      stop.disabled = true;
      stop.onclick = null;
      bar.hidden = true;
      currentRepository.hidden = true;
      $('scan').disabled = false;
      $('scan').textContent = 'Scan';
    }
  }

  function show({ repository, skills, warnings }) {
    setStatus(`${repository.id} · ${skills.length} ${skills.length === 1 ? 'skill' : 'skills'}`);
    warningsPanel.replaceChildren(...warnings.map((text) => element('li', { textContent: `warning: ${text}` })));
    warningsToggle.hidden = warnings.length === 0;
    setWarningsExpanded(warnings.length > 0);
    const filter = $('filter');
    filter.hidden = skills.length === 0;
    filter.oninput = renderSkills;
    renderSkills();

    function renderSkills() {
      const query = filter.value.trim().toLowerCase();
      const words = query ? query.split(/\s+/) : [];
      const matches = skills.filter(({ name, description, path, repository: skillRepository }) => {
        const searchable = `${name} ${description} ${path} ${skillRepository === repository.id ? '' : skillRepository}`.toLowerCase();
        return words.every((word) => searchable.includes(word));
      });
      $('skills').replaceChildren(...matches.map((skill) => skillOption(skill, repository.id, words)));
      if (matches.length > 0) select($('skills').firstChild, matches[0], words);
      else if (words.length > 0) showEmptySkills('No skill matches.', 'No matching skills.');
      else showEmptySkills('No skills.');
    }
  }

  function highlightDescription(description, words) {
    if (words.length === 0) return [description];
    const searchable = description.toLowerCase();
    const matched = new Uint8Array(searchable.length);
    for (const word of new Set(words)) {
      for (let start = searchable.indexOf(word); start !== -1; start = searchable.indexOf(word, start + 1)) {
        matched.fill(1, start, start + word.length);
      }
    }

    const parts = [];
    let offset = 0;
    let run = '';
    let highlighted = false;
    for (const character of description) {
      const end = offset + character.toLowerCase().length;
      const matches = matched.subarray(offset, end).includes(1);
      if (matches !== highlighted) {
        if (run) parts.push(highlighted ? element('mark', { textContent: run }) : run);
        run = '';
        highlighted = matches;
      }
      run += character;
      offset = end;
    }
    if (run) parts.push(highlighted ? element('mark', { textContent: run }) : run);
    return parts;
  }

  function skillOption(skill, repositoryId, words) {
    const item = element('li', { role: 'option', tabIndex: 0 },
        element('div', {},
          element('span', { className: 'name', textContent: skill.name }),
          ...(skill.copies.length ? [element('span', { className: 'badge', textContent: `+${skill.copies.length} ${skill.copies.length === 1 ? 'copy' : 'copies'}` })] : [])),
        element('div', { className: 'description' }, ...highlightDescription(skill.description, words)),
        element('div', { className: 'path', textContent: skill.repository === repositoryId ? skill.path : `${skill.repository} · ${skill.path}` }));
    item.onclick = () => select(item, skill, words);
    item.onkeydown = (event) => { if (event.key === 'Enter') select(item, skill, words); };
    return item;
  }

  let tab = 'text';

  function select(item, skill, words) {
    for (const other of $('skills').children) other.setAttribute('aria-selected', String(other === item));
    const tabButton = (id, label, badge) => {
      const button = element('button', { role: 'tab', id: `tab-${id}`, type: 'button' }, label,
        ...(badge === undefined ? [] : [element('span', { className: 'badge', textContent: String(badge) })]));
      button.setAttribute('aria-selected', String(tab === id));
      button.setAttribute('aria-controls', id);
      button.onclick = () => activateTab(id);
      return button;
    };
    const lines = skill.text.replace(/\r?\n$/, '').split(/\r?\n/);
    const headingLines = new Set(skill.headings.map((heading) => heading.line));
    const text = element('div', { id: 'text', role: 'tabpanel', hidden: tab !== 'text' },
      ...lines.map((line, index) => {
        const row = element('div', { textContent: line, className: headingLines.has(index + 1) ? 'heading' : '' });
        row.dataset.line = String(index + 1);
        return row;
      }));
    const contents = element('ul', { id: 'contents', role: 'tabpanel', hidden: tab !== 'contents' },
      ...(skill.headings.length === 0
        ? [element('li', { className: 'empty', textContent: 'No titles in this SKILL.md.' })]
        : skill.headings.map((heading) => {
            const link = element('a', { href: `#line-${heading.line}`, textContent: heading.title });
            link.onclick = (event) => { event.preventDefault(); jump(heading.line); };
            return element('li', { className: `level-${heading.level}` }, link);
          })));
    $('skill').replaceChildren(
      element('div', { id: 'skill-head' },
        element('h2', { textContent: skill.name }),
        ...(skill.description ? [element('p', {}, ...highlightDescription(skill.description, words))] : []),
        element('a', { href: skill.link, textContent: skill.link, target: '_blank', rel: 'noopener' }),
        ...(skill.copies.length ? [element('div', { className: 'path', textContent: `also in ${skill.copies.join(', ')}` })] : [])),
      element('div', { role: 'tablist', ariaLabel: 'SKILL.md views' }, tabButton('text', 'SKILL.md'), tabButton('contents', 'Contents', skill.headings.length)),
      text,
      contents);
  }

  function activateTab(id) {
    tab = id;
    for (const name of ['text', 'contents']) {
      $(name).hidden = name !== id;
      $(`tab-${name}`).setAttribute('aria-selected', String(name === id));
    }
  }

  /** From Contents to the title's line in SKILL.md. */
  function jump(line) {
    activateTab('text');
    const row = $('text').querySelector(`[data-line="${line}"]`);
    $('text').querySelector('.target')?.classList.remove('target');
    row.classList.add('target');
    row.tabIndex = -1;
    row.focus({ preventScroll: true });
    const tabs = $('skill').querySelector('[role="tablist"]');
    row.style.scrollMarginTop = Math.ceil(tabs.getBoundingClientRect().height) + 1 + 'px';
    row.scrollIntoView({ block: 'start' });
  }

  $('form').onsubmit = (event) => {
    event.preventDefault();
    const repo = $('repo').value.trim();
    if (!repo) return;
    history.replaceState(null, '', `?repo=${encodeURIComponent(repo)}`);
    scan(repo);
  };

  const initial = new URLSearchParams(location.search).get('repo');
  if (initial) { $('repo').value = initial; scan(initial); }
</script>
</body>
</html>
