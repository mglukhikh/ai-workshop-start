<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The only fonts Chromium sees in the demo tests: the same pixels on every machine.
     Every family resolves to TeX Gyre Pagella (a Palatino design), except monospace. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">skill-atlas-demo-fonts</cachedir>
  <config><rescan><int>0</int></rescan></config>

  <alias binding="strong"><family>serif</family><prefer><family>TeX Gyre Pagella</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>TeX Gyre Pagella</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
